name: DotNET

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2025, windows-latest]
      fail-fast: false
      max-parallel: 4
    name: Test .net ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up environment
        run: ./bootstrap.cmd
      - name: Test with .Net
        run: ./build.cmd all
