name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '43 10 * * 2'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.entry.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        entry:
          - { language: java-kotlin, build-mode: manual }
          - { language: csharp, build-mode: none }
          - { language: actions, build-mode: none }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        if: matrix.entry.language == 'java-kotlin'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          cache: maven
          distribution: temurin
          java-version: '27'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.entry.language }}
          build-mode: ${{ matrix.entry.build-mode }}
          queries: +security-and-quality

      - name: Build Java
        if: matrix.entry.language == 'java-kotlin'
        working-directory: Source/JNA
        run: ./mvnw package --batch-mode --no-transfer-progress --show-version -Dlicense.skip=true -DskipTests -Dmaven.compiler.fork=true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.entry.language }}"
