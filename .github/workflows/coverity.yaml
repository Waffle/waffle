name: Coverity

on:
  push:
    branches:
      - coverity_scan

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_OWNER: Waffle
  UPSTREAM_REPO: waffle

jobs:
  build:
    if: github.repository_owner == 'waffle'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          cache: maven
          java-version: '25'
          distribution: temurin
      - name: Analyze with Coverity
        run: |
          wget --quiet https://scan.coverity.com/download/linux64 --post-data "token=${COVERITY_TOKEN}&project=${UPSTREAM_OWNER}%2F${UPSTREAM_REPO}" --output-document=coverity_tool.tgz
          mkdir coverity-tool
          tar --extract --file=coverity_tool.tgz --directory=coverity-tool --strip-components=1
          ./coverity-tool/bin/cov-build --dir cov-int ./mvnw verify --batch-mode --no-transfer-progress --show-version -Dlicense.skip=true -Dmaven.compiler.fork=true -DskipTests=true
          tar --create --gzip --verbose --file="${UPSTREAM_REPO}.tgz" cov-int
          curl --fail-with-body --form "token=${COVERITY_TOKEN}" \
            --form "email=${EMAIL}" \
            --form "file=@${UPSTREAM_REPO}.tgz" \
            --form "version=${UPSTREAM_REPO}/coverity_scan" \
            --form "description=${UPSTREAM_OWNER} Coverity Scan" \
            "https://scan.coverity.com/builds?project=${UPSTREAM_OWNER}%2F${UPSTREAM_REPO}"
        env:
          COVERITY_TOKEN: ${{ secrets.COVERITY_TOKEN }}
          EMAIL: ${{ secrets.EMAIL }}
