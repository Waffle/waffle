name: Java CI

defaults:
  run:
    working-directory: Source/JNA

on: [workflow_dispatch, push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.entry.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        entry:
          - { java: '21', os: windows-latest }
          - { java: '25', os: windows-latest }
          - { java: '27', os: windows-latest }
      fail-fast: false
    name: Test JDK ${{ matrix.entry.java }}, ${{ matrix.entry.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java ${{ matrix.entry.java }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          cache: maven
          distribution: temurin
          java-version: ${{ matrix.entry.java }}
      - name: Test with Maven
        run: ./mvnw test --batch-mode --no-transfer-progress --show-version -D"license.skip=true"
